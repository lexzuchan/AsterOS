name: Build AsterOS ISO

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package bootable ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install compiler and GRUB ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils make grub-pc-bin grub-common xorriso mtools

      - name: Compile kernel and create ISO
        run: make iso

      - name: Show artifact details
        run: |
          file build/kernel.elf build/asteros.iso
          ls -lh build/asteros.iso
          grub-file --is-x86-multiboot build/kernel.elf

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: AsterOS-bootable-ISO
          path: build/asteros.iso
          if-no-files-found: error
          retention-days: 30
